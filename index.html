<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050811" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Cartas: Reinos do Destino</title>
    <meta name="description" content="Jogo tático de batalha de cartas entre reinos medievais lendários com poderes elementais e estratégia dinastia." />
    <meta property="og:title" content="Cartas: Reinos do Destino" />
    <meta property="og:description" content="Jogo tático de batalha de cartas entre reinos medievais lendários com poderes elementais e estratégia dinastia." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div style="min-height:100dvh;display:grid;place-content:center;text-align:center;gap:16px;padding:24px;background:#050811;color:#e2e8f0;font-family:system-ui">
        <h1 style="color:#e5c389">Reinos do Destino</h1>
        <p id="loading-status" role="status">Carregando o jogo…</p>
        <button id="retry-load" hidden style="padding:14px;border-radius:8px;cursor:pointer">Tentar novamente</button>
      </div>
    </div>
    <script>
      function showLoadError() {
        var status = document.getElementById('loading-status');
        var retry = document.getElementById('retry-load');
        if (status) status.textContent = 'Não foi possível carregar o jogo. Verifique sua conexão e tente novamente.';
        if (retry) retry.hidden = false;
      }
      document.getElementById('retry-load').addEventListener('click', function () {
        var url = new URL(location.href);
        url.searchParams.set('v', Date.now().toString());
        location.replace(url.href);
      });
      window.addEventListener('error', showLoadError, true);
      window.addEventListener('unhandledrejection', showLoadError);
      setTimeout(showLoadError, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
