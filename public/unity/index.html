<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101b18">
<title>Reinos do Destino · Unity</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#101b18;color:#f4e4c1;font-family:system-ui,sans-serif}#arena{position:fixed;inset:0;display:flex;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}#unity-canvas{display:block;width:100%;height:100%;max-width:75vh;max-width:75dvh;outline:0;touch-action:none;background:#101b18}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#101b18;text-align:center}#loading[hidden]{display:none}.intro{max-width:340px}h1{font-family:Georgia,serif;color:#dfbc70;font-size:30px;margin:0 0 12px}p{line-height:1.5}button{min-height:48px;padding:12px 24px;border:1px solid #dfbc70;border-radius:10px;background:#6d391d;color:#fff4dc;font:600 17px system-ui;cursor:pointer}button:disabled{opacity:.65}progress{display:block;width:100%;height:12px;accent-color:#dfbc70;margin:20px 0}progress[hidden]{display:none}#status{min-height:3em;font-size:15px}#tip{font-size:13px;color:#c9bea5}
</style>
</head>
<body>
<main id="arena"><canvas id="unity-canvas" tabindex="0" aria-label="Arena de combate Reinos do Destino"></canvas></main>
<section id="loading" aria-label="Carregar jogo"><div class="intro">
<h1>Reinos do Destino</h1><p>Ascensão Elemental</p>
<button id="start" type="button">INICIAR JOGO</button>
<progress id="progress" value="0" max="1" hidden aria-label="Progresso do carregamento"></progress>
<p id="status" role="status" aria-live="polite">Entre na arena dos quatro elementos.</p>
<p id="tip">No Safari, use Compartilhar → Adicionar à Tela de Início para jogar com mais espaço.</p>
</div></section>
<script>
const canvas=document.getElementById('unity-canvas'),overlay=document.getElementById('loading'),start=document.getElementById('start'),progress=document.getElementById('progress'),status=document.getElementById('status');
const buildUrl='Build';
const config={dataUrl:buildUrl+'/8eb81d511039f33ced8a6e0680afb430.data.unityweb',frameworkUrl:buildUrl+'/b21e85ddaf2e39a521aff932110909a7.framework.js.unityweb',codeUrl:buildUrl+'/b14412d2d0af97d620213f86b9c1a6f8.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:"ReinosDoDestino",productName:"Reinos do Destino",productVersion:"1.0",matchWebGLToCanvasSize:true,devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),autoSyncPersistentDataPath:true,showBanner:(message,type)=>{if(type==='error')console.error(message);}};
function fit(){const viewport=window.visualViewport;document.getElementById('arena').style.height=(viewport?viewport.height:window.innerHeight)+'px';}
window.addEventListener('resize',fit);window.visualViewport?.addEventListener('resize',fit);fit();
function failed(error){console.error(error);status.textContent='Não foi possível abrir o jogo. Confira a conexão e tente novamente.';start.disabled=false;start.textContent='TENTAR NOVAMENTE';start.onclick=()=>location.reload();progress.hidden=true;}
start.addEventListener('click',()=>{start.disabled=true;start.textContent='CARREGANDO…';progress.hidden=false;status.textContent='O primeiro acesso pode demorar um pouco. Aguarde nesta tela.';const script=document.createElement('script');script.src=buildUrl+'/dcc0c7f789f9c68515044a5d9040fbe1.loader.js';script.onerror=failed;script.onload=()=>{createUnityInstance(canvas,config,value=>{progress.value=value;status.textContent='Carregando arena… '+Math.round(value*100)+'%';}).then(instance=>{window.elementalUnity=instance;overlay.hidden=true;canvas.focus();}).catch(failed);};document.body.appendChild(script);},{once:true});
</script>
</body>
</html>
